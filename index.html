<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lihat proyek-proyek yang sedang dikerjakan oleh tim AQUASCAPE. Halaman ini menampilkan daftar repository dan dokumentasi terkini.">
  <meta name="theme-color" content="#0a0e17">
  <title>AQUASCAPE — Projects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <div class="header-brand">
      <span class="header-brand-name">AQUASCAPE<span class="header-brand-dot">.org</span></span>
    </div>
    <nav class="header-nav">
      <a href="#projects" class="header-nav-link">Projects</a>
      <a href="https://github.com/aquascapedotorg" target="_blank" rel="noopener" class="header-github-link" id="github-org-link">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-ambient">
      <div class="hero-ambient-orb"></div>
      <div class="hero-ambient-orb"></div>
      <div class="hero-ambient-orb"></div>
    </div>
    <div class="hero-content">
      <div class="hero-label">
        <span class="hero-label-dot"></span>
        Open Source Organization
      </div>
      <h1 class="hero-title">
        Proyek dari <span class="hero-title-accent">AQUASCAPE</span>
      </h1>
      <p class="hero-description">
        Daftar repository dan dokumentasi proyek yang sedang kami kerjakan. Klik untuk membaca README selengkapnya.
      </p>
      <div class="hero-stats" id="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-value" id="stat-repos">—</div>
          <div class="hero-stat-label">Repositories</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-value" id="stat-languages">—</div>
          <div class="hero-stat-label">Languages</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-value" id="stat-updated">—</div>
          <div class="hero-stat-label">Last updated</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Cari proyek..." aria-label="Cari proyek">
      </div>
      <div class="filter-tags" id="filter-tags" role="group" aria-label="Filter bahasa">
        <button class="filter-tag active" data-lang="all">Semua</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main-content" id="projects">
    <div class="results-info" id="results-info"></div>
    <div class="projects-grid" id="projects-grid">
      <div class="loading-state" id="loading-state">
        <div class="loading-spinner"></div>
        <div class="loading-text">Memuat proyek...</div>
      </div>
    </div>
  </main>

  <!-- README Modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-container">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-close" id="modal-close" aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="markdown-body" id="modal-readme-content"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">&copy; AQUASCAPE</span>
      <div class="footer-links">
        <a href="https://github.com/aquascapedotorg" target="_blank" rel="noopener" class="footer-link">GitHub</a>
      </div>
      <div class="footer-update" id="footer-update"></div>
    </div>
  </footer>

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
