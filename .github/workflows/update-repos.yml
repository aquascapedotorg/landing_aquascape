name: Update Repository Data & Deploy

on:
  # Run every 10 minutes
  schedule:
    - cron: '*/10 * * * *'

  # Run on push to main
  push:
    branches: [main]

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    # Bind the job to the GitHub Pages environment so its environment-scoped
    # variables (VITE_*) become available to steps via the `vars` context.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate repos.json
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_TOKEN }}
        run: node generate-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos.json public/repos.json
          git diff --cached --quiet || git commit -m "chore: update repos data [automated]"
          git push

      - name: Build production site
        # Vite bakes VITE_* values into the bundle at build time, so they must be
        # present as process env vars during `npm run build`. Map them from the
        # environment variables here (anon key is a public key, safe to inline).
        env:
          VITE_FISH_DATA_SOURCE: ${{ vars.VITE_FISH_DATA_SOURCE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_FISH_TABLE: ${{ vars.VITE_SUPABASE_FISH_TABLE }}
        run: |
          cp repos.json public/repos.json
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
